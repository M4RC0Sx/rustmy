# Local servers for integration tests and benchmarks: `docker compose up -d --wait`.
# Pick versions with MYSQL_VERSION / MARIADB_VERSION, e.g.
#   MYSQL_VERSION=9.7 docker compose up -d --wait mysql
# Data lives in tmpfs, so every restart starts from a clean server.
services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    # `loose-` makes the option a no-op on 9.x, where the plugin was removed.
    command: ["--loose-mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: rustmy
      MYSQL_DATABASE: rustmy_test
      MYSQL_USER: rustmy
      MYSQL_PASSWORD: rustmy
    ports: ["13306:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./tests/docker/mysql-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Logging in over TLS also primes the server's caching_sha2_password
      # cache for `rustmy`, so plain-TCP clients take the fast-auth path.
      # Full auth over plain TCP needs TLS or RSA, not implemented yet.
      test:
        - CMD
        - mysql
        - -h127.0.0.1
        - -urustmy
        - -prustmy
        - --ssl-mode=REQUIRED
        - -e
        - SELECT 1
      interval: 2s
      timeout: 5s
      retries: 90

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    command: ["--max-allowed-packet=64M"]
    environment:
      MARIADB_ROOT_PASSWORD: rustmy
      MARIADB_DATABASE: rustmy_test
      MARIADB_USER: rustmy
      MARIADB_PASSWORD: rustmy
    ports: ["13307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 90
