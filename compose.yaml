# Local servers for integration tests and benchmarks: `docker compose up -d --wait`.
# Pick versions with MYSQL_VERSION / MARIADB_VERSION, e.g.
#   MYSQL_VERSION=9.7 docker compose up -d --wait mysql
# Data lives in tmpfs, so every restart starts from a clean server. TLS uses
# throwaway certificates that the `certs` service generates on first start
# into tests/docker/certs (git-ignored).
services:
  certs:
    image: alpine:3.22
    command: ["sh", "/work/gen-certs.sh"]
    volumes:
      # The parent directory, so the script can (re)create certs/ itself.
      - ./tests/docker:/work

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    # `loose-` makes the option a no-op on 9.x, where the plugin was removed.
    # LOAD DATA LOCAL INFILE is off by default on MySQL 8.0+ (on in MariaDB).
    command:
      - --loose-mysql-native-password=ON
      - --local-infile=ON
      - --ssl-ca=/certs/ca.pem
      - --ssl-cert=/certs/server.pem
      - --ssl-key=/certs/server-key.pem
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: rustmy
      MYSQL_DATABASE: rustmy_test
      MYSQL_USER: rustmy
      MYSQL_PASSWORD: rustmy
    ports: ["13306:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./tests/docker/mysql-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./tests/docker/certs:/certs:ro
    healthcheck:
      # Ready once the `rustmy` account can log in over TLS.
      test:
        - CMD
        - mysql
        - -h127.0.0.1
        - -urustmy
        - -prustmy
        - --ssl-mode=REQUIRED
        - -e
        - SELECT 1
      interval: 2s
      timeout: 5s
      retries: 90

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    # PAM asks for the password with mysql_clear_password instead of its
    # dialog plugin (the `rustmy_pam` account, tests/docker/pam).
    command:
      - --max-allowed-packet=64M
      - --local-infile=ON
      - --plugin-load-add=auth_pam
      - --loose-pam-use-cleartext-plugin=ON
      - --ssl-ca=/certs/ca.pem
      - --ssl-cert=/certs/server.pem
      - --ssl-key=/certs/server-key.pem
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      MARIADB_ROOT_PASSWORD: rustmy
      MARIADB_DATABASE: rustmy_test
      MARIADB_USER: rustmy
      MARIADB_PASSWORD: rustmy
    ports: ["13307:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./tests/docker/mariadb-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./tests/docker/certs:/certs:ro
      - ./tests/docker/pam/rustmy:/etc/pam.d/rustmy:ro
      - ./tests/docker/pam/rustmy-check:/etc/pam.d/rustmy-check:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 90

  # Benchmarks only (`docker compose --profile bench up -d --wait`): TCP
  # proxies in front of both servers, on 23306 (MySQL) and 23307 (MariaDB),
  # whose latency the benchmarks set through the API on 8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [bench]
    command: ["-host=0.0.0.0", "-config=/toxiproxy.json"]
    ports: ["8474:8474", "23306:23306", "23307:23307"]
    volumes:
      - ./tests/docker/toxiproxy.json:/toxiproxy.json:ro
