[package]
name = "rustmy-proto"
description = "Pure-Rust MySQL/MariaDB wire protocol core used by rustmy"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Entry points and a scripted transport for `fuzz/`; never enabled in builds.
fuzzing = []

[dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["hazmat", "fast", "zeroize"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
pkcs1 = { version = "0.8", features = ["pem"] }
pkcs8 = { version = "0.11", features = ["pem"] }
rsa = "0.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16", features = ["std"] }
rustls-platform-verifier = "0.7"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
zstd = { version = "0.14", default-features = false }

[lints]
workspace = true

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
