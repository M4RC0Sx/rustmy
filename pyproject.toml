[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "rustmy"
description = "Fast DB-API 2.0 and asyncio driver for MySQL/MariaDB written in Rust, no system libraries required"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "THIRD-PARTY-LICENSES"]
authors = [{ name = "M4RC0Sx", email = "contact@marcosalonso.dev" }]
maintainers = [{ name = "M4RC0Sx", email = "contact@marcosalonso.dev" }]
keywords = [
    "mysql",
    "mariadb",
    "dbapi",
    "pep249",
    "asyncio",
    "database",
    "driver",
    "sqlalchemy",
    "rust",
    "free-threading",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Version comes from [workspace.package] in Cargo.toml.
dynamic = ["version"]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
# The asyncio dialects: SQLAlchemy's asyncio layer needs greenlet.
sqlalchemy-asyncio = ["sqlalchemy[asyncio]>=2.0"]

[project.urls]
Homepage = "https://github.com/M4RC0Sx/rustmy"
Documentation = "https://github.com/M4RC0Sx/rustmy#readme"
Repository = "https://github.com/M4RC0Sx/rustmy"
Issues = "https://github.com/M4RC0Sx/rustmy/issues"
Changelog = "https://github.com/M4RC0Sx/rustmy/blob/master/CHANGELOG.md"
Benchmarks = "https://github.com/M4RC0Sx/rustmy/blob/master/benches/README.md"

[project.entry-points."sqlalchemy.dialects"]
"mysql.rustmy" = "rustmy.dialect:RustmyMySQLDialect"
"mariadb.rustmy" = "rustmy.dialect:RustmyMariaDBDialect"
"mysql.rustmy_async" = "rustmy.aio.dialect:RustmyAsyncMySQLDialect"
"mariadb.rustmy_async" = "rustmy.aio.dialect:RustmyAsyncMariaDBDialect"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "maturin>=1.16,<2.0",
    "mypy>=1.18",
    "pymysql>=1.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-codspeed>=5.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-randomly>=4.0",
    "ruff>=0.17.6",
    "sqlalchemy[asyncio]>=2.0",
    "testcontainers[mysql]>=4.13",
    "time-machine>=2.19",
]
# mysqlclient needs libmysqlclient + pkg-config to build, so it stays out of
# the default sync: `uv sync --group bench`.
bench = [
    # Only to compare with in benches/showcase.py; never shipped.
    "aiomysql>=0.2",
    "asyncmy>=0.2.10",
    "django>=5.2",
    # Charts only (report.py, showcase_render.py). Python 3.11+: Pillow, its
    # dependency, has no fixed release for 3.10 (Pillow 13 dropped it).
    "matplotlib>=3.10; python_version >= '3.11'",
    "mysql-connector-python>=9.4",
    "mysqlclient>=2.3.2",
    "pytest-benchmark>=5.1",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[tool.uv]
default-groups = ["dev"]
# Rebuild the extension on `uv sync` / `uv run` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.maturin]
manifest-path = "crates/pydriver/Cargo.toml"
python-source = "python"
module-name = "rustmy._core"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["python", "tests", "benches"]
# The PEP 249 suite, kept byte for byte as published (tests/test_dbapi20.py).
extend-exclude = ["tests/dbapi20.py"]

[tool.ruff.lint]
extend-select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors (full set)
    "EM",    # flake8-errmsg
    "FBT",   # flake8-boolean-trap
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "INT",   # flake8-gettext
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]
ignore = [
    "PLR0913", # too many arguments — sometimes unavoidable
    "PLR2004", # magic value comparison — too many false positives
    "TRY003",  # long exception messages — sometimes clearer inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is how pytest checks
    "S106",   # throwaway credentials of the docker test servers
    "S608",   # SQL built from the tests' own constants, not user input
    "DTZ001", # MySQL DATETIME values are naive by definition
]
"python/rustmy/constants/*.py" = [
    "N999", # module names match the other MySQL drivers' (`from rustmy.constants import ER`)
]
"scripts/**" = [
    "T201", # command-line reports go to stdout
    "S106", # throwaway credentials of the docker test servers
]
"benches/**" = [
    "T201", # command-line reports go to stdout
    "S101", # sanity asserts on benchmark results
    "S105", # throwaway credentials of the docker test servers
    "S608", # SQL built from the script's own constants, not user input
]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy evaluates the annotations of mapped classes at runtime.
runtime-evaluated-base-classes = ["sqlalchemy.orm.DeclarativeBase"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["rustmy"]

[tool.mypy]
strict = true
python_version = "3.10"
namespace_packages = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "python"
files = ["python", "tests", "benches", "scripts"]
exclude = ['^tests/dbapi20\.py$']  # see the tests.dbapi20 override below

[[tool.mypy.overrides]]
# Benchmark-only dependencies (bench group, absent from the dev env); the
# reference drivers ship no type information either.
module = [
    "MySQLdb", "MySQLdb.*", "pymysql", "pymysql.*", "matplotlib", "matplotlib.*",
    "mysql", "mysql.*", "django", "django.*", "asyncmy", "asyncmy.*", "aiomysql",
    "uvloop",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The PEP 249 suite, kept byte for byte as published (untyped, Python 2 era).
# Skipping it makes the module `Any`, so subclassing it needs no casts.
module = ["tests.dbapi20"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# SQLAlchemy's test suite (sqlalchemy.testing) ships no annotations, and
# replacing a suite class by redefining its name is how the suite is meant to
# be customised.
module = ["tests.sqla_suite.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that hit real external services (DB, Redis, HTTP)",
    "slow: tests > 1s",
]

[tool.coverage.run]
source = ["rustmy"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
