# Weekly updates into develop, grouped so each ecosystem opens one pull
# request (majors apart). Titles are Conventional Commits (pr-title.yml):
# `build` for crates compiled into the wheels (a patch release), `chore` for
# development tools, `ci` for workflows.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Development and benchmark tools. The package's only Python dependency
    # is SQLAlchemy, in its extras: Dependabot would raise their public
    # floor, and the lock must keep 2.0 for Python 3.10 and 2.1 elsewhere,
    # so SQLAlchemy is upgraded by hand (`uv lock --upgrade-package
    # sqlalchemy`).
    ignore:
      # Also "sqlalchemy[asyncio]", as Dependabot names it with the extra.
      - dependency-name: "sqlalchemy*"
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # semantic-release, the release tooling.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # 10+ needs conventional-changelog-writer 9, and
      # @semantic-release/release-notes-generator 14 still loads 8: the release
      # notes would fail to render. Lift once it moves on.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]
    groups:
      release-tooling:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Actions are pinned by commit; this keeps the pins and their version
    # comments current.
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # Pinned to branches (stable, nightly, 1.88), not releases: Dependabot
      # would move all three to the stable branch's commit. Updated by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        update-types: [minor, patch]
