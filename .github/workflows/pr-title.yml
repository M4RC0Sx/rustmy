name: pr-title

# A pull request into develop is squash-merged with its title as the commit
# message, and semantic-release reads those messages to pick the next version
# and write the changelog: the title must be a Conventional Commit.
# (Pull requests into master are merged as they are; their title is unused.)
on:
  pull_request:
    branches: [develop]
    types: [opened, edited, reopened, synchronize]

# Reading the title needs nothing more. (Not pull_request_target: GitHub runs
# that from the default branch, master, which only gets workflows on release.)
permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The types release.config.mjs knows.
          types: |
            feat
            fix
            perf
            refactor
            build
            revert
            docs
            test
            ci
            chore
            style
          requireScope: false
