name: Coverage

# Python and Rust coverage, uploaded to Codecov with a flag each. The Rust
# side includes the PyO3 bindings: the extension is built with coverage
# instrumentation and exercised by the Python tests, the only tests it has.
on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage (Python and Rust)
    runs-on: ubuntu-latest
    env:
      RUSTMY_TEST_SERVERS: mysql,mariadb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: docker compose up -d --wait mysql mariadb
      - name: Tests with instrumented Rust
        run: |
          # Every cargo build below (nextest's and maturin's) gets the
          # instrumentation flags and writes its profiles where
          # `cargo llvm-cov report` looks for them.
          eval "$(cargo llvm-cov show-env --sh)"
          export CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR"
          cargo llvm-cov clean --workspace
          cargo nextest run -p rustmy-proto --run-ignored all
          uv run --no-sync maturin develop --uv
          uv run --no-sync pytest --cov --cov-report=
          uv run --no-sync pytest -c tests/sqla_suite/pytest.ini tests/sqla_suite \
            --db mysql --db mariadb --db mysql_prepared --db mariadb_prepared \
            --db mysql_async --db mariadb_async \
            --cov=rustmy --cov-append --cov-report=
          uv run --no-sync coverage xml -o coverage.xml
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
