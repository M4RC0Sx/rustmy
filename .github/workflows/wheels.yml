name: wheels

# Builds every wheel (8 platforms x every supported Python) and the sdist,
# then installs each wheel into a fresh environment and smoke-tests it against
# a real server. Publishes nothing: release.yml calls it with the version about
# to be released, and on its own it runs as a check for pull requests that
# touch the packaging.
on:
  workflow_call:
    inputs:
      version:
        description: Version to build (stamped into Cargo.toml, not committed)
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - pyproject.toml
      - uv.lock
      - about.toml
      - about.hbs
      - THIRD-PARTY-LICENSES
      - scripts/set_version.py
      - scripts/locked_version.py
      - scripts/smoke_test.py
      - scripts/smoke_wheels.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every supported CPython, free-threaded builds included. A platform can
  # narrow it (matrix `pythons`) where no official interpreter exists.
  PYTHONS: "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    # Provenance attestations of release builds (see the attest steps).
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          # No official CPython 3.10 for Windows on Arm.
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, pythons: "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t" }
    env:
      PLATFORM_PYTHONS: ${{ matrix.platform.pythons || '3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Stamp the release version
        if: inputs.version != ''
        # bash on Windows too: PowerShell reads environment variables as
        # $env:VERSION, and its $VERSION is an empty variable of its own.
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project scripts/set_version.py "$VERSION"
      # Linux builds run in the manylinux/musllinux images, which ship every
      # CPython; elsewhere uv installs them and maturin gets their paths.
      - name: Interpreter paths
        if: runner.os != 'Linux'
        shell: bash
        run: |
          # shellcheck disable=SC2086  # one argument per version
          uv python install $PLATFORM_PYTHONS
          paths=""
          for python in $PLATFORM_PYTHONS; do
            paths="$paths $(uv python find --managed-python "$python")"
          done
          echo "INTERPRETERS=$paths" >> "$GITHUB_ENV"
      - name: Interpreter names
        if: runner.os == 'Linux'
        shell: bash
        run: echo "INTERPRETERS=$PLATFORM_PYTHONS" >> "$GITHUB_ENV"
      # The maturin of uv.lock (development's, kept current by Dependabot)
      # builds the release too, not whichever is latest that day.
      - name: Maturin version
        shell: bash
        run: echo "MATURIN_VERSION=$(uv run --no-project scripts/locked_version.py maturin)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist --interpreter ${{ env.INTERPRETERS }}
      # Provenance for release builds only (release.yml grants the
      # permissions; pull requests have none to give).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: inputs.version != '' && github.event_name == 'push'
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    # Provenance attestations of release builds (see the attest steps).
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Stamp the release version
        if: inputs.version != ''
        # bash on Windows too: PowerShell reads environment variables as
        # $env:VERSION, and its $VERSION is an empty variable of its own.
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project scripts/set_version.py "$VERSION"
      # The maturin of uv.lock (development's, kept current by Dependabot)
      # builds the release too, not whichever is latest that day.
      - name: Maturin version
        shell: bash
        run: echo "MATURIN_VERSION=$(uv run --no-project scripts/locked_version.py maturin)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: inputs.version != '' && github.event_name == 'push'
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # wheels-*: release.yml collects everything with one plain pattern.
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Linux: the server is a service container; musl wheels are tested inside
  # an Alpine container on the same runner.
  smoke-linux:
    name: smoke (${{ matrix.platform.name }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-24.04 }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, alpine: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rustmy
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -prustmy"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      RUSTMY_SMOKE_HOST: 127.0.0.1
      RUSTMY_SMOKE_PASSWORD: rustmy
      RUSTMY_SMOKE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !matrix.platform.alpine }}
      - name: Smoke test
        if: ${{ !matrix.platform.alpine }}
        run: scripts/smoke_wheels.sh dist "$PYTHONS"
      - name: Smoke test (Alpine)
        if: ${{ matrix.platform.alpine }}
        run: |
          # uv's CPython builds for every version but 3.10.
          docker run --rm --network host -v "$PWD:/work" -w /work \
            -e RUSTMY_SMOKE_HOST -e RUSTMY_SMOKE_PASSWORD -e RUSTMY_SMOKE_VERSION \
            ghcr.io/astral-sh/uv:alpine \
            sh -c 'apk add --no-cache bash >/dev/null && scripts/smoke_wheels.sh dist "$0"' "${PYTHONS/3.10 /}"
          # CPython 3.10 on musl names extensions *-linux-gnu.so (fixed in 3.11),
          # and so do the cp310 musllinux wheels built with it (as other projects'
          # are); uv's 3.10 build expects *-linux-musl.so and loads none of them.
          # Test 3.10 with the official Alpine image, as Alpine users run it.
          docker run --rm --network host -v "$PWD:/work" \
            -e RUSTMY_SMOKE_HOST -e RUSTMY_SMOKE_PASSWORD -e RUSTMY_SMOKE_VERSION \
            python:3.10-alpine \
            sh -c 'pip install -q --root-user-action=ignore --no-index --find-links /work/dist rustmy && cd /tmp && python /work/scripts/smoke_test.py'

  # macOS and Windows runners have no Docker: the server is installed natively.
  # Import-only where no server can run (`import-only: true`), listed here:
  # - windows-arm64: actions-setup-mysql has no MySQL build for Windows on Arm.
  smoke-native:
    name: smoke (${{ matrix.platform.name }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-15 }
          - { name: windows-x64, runner: windows-2025 }
          - { name: windows-arm64, runner: windows-11-arm, pythons: "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t", import-only: true }
    env:
      # Empty for import-only platforms. A missing key is null, and null == false
      # in expressions (both become 0), hence the negation.
      RUSTMY_SMOKE_HOST: ${{ !matrix.platform.import-only && '127.0.0.1' || '' }}
      RUSTMY_SMOKE_PASSWORD: rustmy
      RUSTMY_SMOKE_VERSION: ${{ inputs.version }}
      PLATFORM_PYTHONS: ${{ matrix.platform.pythons || '3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - uses: shogo82148/actions-setup-mysql@13a38f2af408e58a0c80168fc620a63a15357339 # v1.56.2
        if: ${{ !matrix.platform.import-only }}
        with:
          mysql-version: "8.4"
          root-password: rustmy
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Smoke test
        run: scripts/smoke_wheels.sh dist "$PLATFORM_PYTHONS"
