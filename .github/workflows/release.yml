name: release

# Merging develop into master releases. One workflow, because a tag pushed from
# a workflow does not trigger other workflows:
#
#   plan     semantic-release --dry-run: is there a release, and which version?
#   build    every wheel and the sdist with that version, each smoke-tested
#   release  semantic-release: commit (CHANGELOG.md, Cargo.toml, Cargo.lock;
#            [skip ci]), tag and GitHub release with the wheels attached
#   publish  PyPI, through trusted publishing (no stored token)
#
# Nothing is tagged or published unless every wheel built and passed. On pull
# requests into master the same plan and build run as a rehearsal.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half-way.
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # No install scripts: the release tooling needs none, and the release
      # job below runs it with a token that can push.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - name: Next version
        id: next
        env:
          RELEASE_PLAN: "1"
        run: |
          # Plan on a local master at what is being built (the push, or the
          # merge result of a pull request, where semantic-release would see
          # refs/pull/N/merge and refuse): GitHub's CI variables hidden so it
          # reads the branch from git, and the checkout itself as the remote
          # (tags included), so planning needs no push permission. Only the
          # release job writes.
          git checkout -q -B master
          env -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME -u GITHUB_REF \
            npx semantic-release --dry-run --no-ci --repository-url "file://$PWD"
          version="$(cat .release-version 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "### Next release: $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: nothing since the last one changes what users get" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    # wheels.yml attests what it builds for a release (see there).
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/wheels.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  release:
    needs: [plan, build]
    if: github.event_name == 'push' && needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release commit, tag and GitHub release
      attestations: read # provenance check of the wheels
      issues: write # comments on the issues a release fixes
      pull-requests: write # and on the pull requests it ships
    steps:
      # A GitHub App can push the release commit to a protected master; without
      # one (RELEASE_APP_CLIENT_ID unset) the workflow's own token is used.
      - name: Release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Every file must be exactly what the build jobs attested: nothing else
      # in this run (an action, a cache) replaced it in between. Checked
      # before anything is tagged, and again before publishing.
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wheels.yml" >/dev/null
          done
          echo "$(ls dist | wc -l) files verified"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          npx semantic-release
          # Same commits as the plan, so the same version as the wheels.
          test "$(cat .release-version)" = "$EXPECTED_VERSION"

  publish:
    needs: release
    runs-on: ubuntu-24.04
    # Trusted publishing: PyPI accepts this workflow's OIDC token for this
    # environment (configured once on PyPI); no stored secret. The environment
    # requires the maintainer's approval, so nothing reaches PyPI unattended
    # (the GitHub release is already out by then).
    environment:
      name: pypi
      url: https://pypi.org/project/rustmy/
    permissions:
      id-token: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # No checkout here (the job stays minimal): gh verifies each file.
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wheels.yml" >/dev/null
          done
          echo "$(ls dist | wc -l) files verified"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
