# cargo-about: the licenses of every crate compiled into the wheels, written to
# THIRD-PARTY-LICENSES (shipped in each wheel; CI checks that it is current):
#
#   cargo about generate --frozen -m crates/pydriver/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES
#
# The accepted licenses mirror the allow-list in deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Every platform a wheel is built for: platform-specific crates included.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Crates whose license files cargo-about cannot find on its own.
workarounds = ["ring", "rustls"]
