# SQLAlchemy's dialect compliance suite runs as a pytest session of its own:
# its plugin must be loaded by the initial conftest and reads `test.cfg` from
# the root directory, which this file sets. From the repository root:
#
#   uv run pytest -c tests/sqla_suite/pytest.ini tests/sqla_suite --db mysql --db mariadb
[pytest]
addopts = -ra --tb=native -p no:randomly -p no:cacheprovider
python_files = test_*.py
# Marks the SQLAlchemy plugin applies (SQLAlchemy registers them in its own
# setup.cfg, which a third-party dialect does not have).
markers =
    backend: tests that run against every database backend
    sparse_backend: tests that run against one database of each kind
    sparse_driver_backend: tests that run against one driver of each backend
    mypy: mypy plugin tests
    timing_intensive: tests sensitive to timing
    memory_intensive: tests that measure memory
