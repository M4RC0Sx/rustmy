# Read by SQLAlchemy's test plugin (sqlalchemy.testing).
[sqla_testing]
requirement_cls = requirements:Requirements
profile_file = profiles.txt

[db]
default = mysql+rustmy://rustmy:rustmy@127.0.0.1:13306/sqla_test
mysql = mysql+rustmy://rustmy:rustmy@127.0.0.1:13306/sqla_test
mariadb = mariadb+rustmy://rustmy:rustmy@127.0.0.1:13307/sqla_test
# The same with every statement prepared (PreparedCursor).
mysql_prepared = mysql+rustmy://rustmy:rustmy@127.0.0.1:13306/sqla_test?cursorclass=PreparedCursor
mariadb_prepared = mariadb+rustmy://rustmy:rustmy@127.0.0.1:13307/sqla_test?cursorclass=PreparedCursor
# The asyncio dialects (rustmy.aio), and with every statement prepared.
mysql_async = mysql+rustmy_async://rustmy:rustmy@127.0.0.1:13306/sqla_test
mariadb_async = mariadb+rustmy_async://rustmy:rustmy@127.0.0.1:13307/sqla_test
mysql_async_prepared = mysql+rustmy_async://rustmy:rustmy@127.0.0.1:13306/sqla_test?cursorclass=PreparedCursor
mariadb_async_prepared = mariadb+rustmy_async://rustmy:rustmy@127.0.0.1:13307/sqla_test?cursorclass=PreparedCursor
