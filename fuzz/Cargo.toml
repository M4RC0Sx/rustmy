# Fuzz targets for the protocol core. Built only by cargo-fuzz on nightly:
#   cargo +nightly fuzz run session
# Kept out of the main workspace (see the root Cargo.toml `exclude`).
[package]
name = "rustmy-fuzz"
version = "0.0.0"
authors = ["M4RC0Sx <contact@marcosalonso.dev>"]
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustmy-proto = { path = "../crates/proto", features = ["fuzzing"] }
# The released protocol core, for the `differential` target.
rustmy-proto-1-3-2 = { package = "rustmy-proto", git = "https://github.com/M4RC0Sx/rustmy", tag = "v1.3.2", features = ["fuzzing"] }

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packets"
path = "fuzz_targets/packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compressed"
path = "fuzz_targets/compressed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "result_set"
path = "fuzz_targets/result_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_values"
path = "fuzz_targets/text_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql"
path = "fuzz_targets/sql.rs"
test = false
doc = false
bench = false
